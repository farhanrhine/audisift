<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — AI Candidate Screener</title>
  <meta name="description" content="Sign in to your AI Candidate Screener recruiter account." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--paper);
    }

    .auth-wrap {
      width: 100%;
      max-width: 420px;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .auth-logo-icon {
      width: 36px; height: 36px;
      color: var(--accent);
    }
    .auth-logo-icon svg { width: 100%; height: 100%; stroke-width: 2px; }
    .auth-logo-text {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--ink);
    }

    .auth-card {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 44px 40px;
      box-shadow: var(--shadow-hover);
    }

    .auth-card h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--ink);
      margin-bottom: 8px;
      text-align: center;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.95rem;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--paper-warm);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: var(--font-body);
      color: var(--ink);
      transition: var(--transition);
      box-sizing: border-box;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--ink);
      background: var(--paper);
      box-shadow: 0 0 0 3px rgba(26,24,22,0.06);
    }

    .btn-auth {
      width: 100%;
      padding: 14px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-auth:hover:not(:disabled) {
      background: var(--ink-soft);
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }
    .btn-auth:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .auth-error {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid rgba(229, 43, 80, 0.2);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: none;
      font-weight: 500;
    }

    .auth-success {
      background: rgba(43, 122, 80, 0.08);
      color: var(--accent-green);
      border: 1px solid rgba(43, 122, 80, 0.2);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: none;
      font-weight: 500;
    }

    .auth-links {
      text-align: center;
      margin-top: 28px;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }
    .auth-links a {
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }
    .auth-links a:hover {
      border-color: var(--ink);
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-wrap">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" class="icon"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5M12 19v3M8 22h8"/></svg>
      </div>
      <div class="auth-logo-text">AI Screener</div>
    </div>

    <!-- Card -->
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Sign in to your recruiter account</p>

      <div id="errorMsg" class="auth-error"></div>
      <div id="successMsg" class="auth-success"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email"
            placeholder="you@company.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password"
            placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-auth" id="submitBtn">
          <span id="btnContent">Sign In</span>
        </button>
      </form>
    </div>

    <div class="auth-links">
      Don't have an account? <a href="register.html">Create one</a>
      &nbsp;·&nbsp;
      <a href="index.html">Take Interview</a>
    </div>

    <div style="text-align:center; margin-top:24px;">
      <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme" style="margin:auto;">
        <svg viewBox="0 0 24 24" fill="none" class="icon theme-toggle-icon"></svg>
      </button>
    </div>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');
  const btnContent = document.getElementById('btnContent');

  errorMsg.style.display = 'none';
  submitBtn.disabled = true;
  btnContent.innerHTML = '<div class="spinner"></div> Signing in…';

  try {
    await login(email, password);
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorMsg.textContent = err.message || 'Login failed. Please check your credentials.';
    errorMsg.style.display = 'block';
    submitBtn.disabled = false;
    btnContent.textContent = 'Sign In';
  }
});

// Show success message from register redirect
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('registered') === '1') {
  const succ = document.getElementById('successMsg');
  succ.textContent = 'Account created! Please sign in.';
  succ.style.display = 'block';
}

// If already logged in, redirect
window.addEventListener('load', async () => {
  try {
    await checkAuth();
    window.location.href = 'dashboard.html';
  } catch (e) {
    // Not logged in — stay here
  }
});
</script>
<script src="js/feedback.js"></script>
</body>
</html>
