<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Audisift</title>
  <meta name="description" content="Create your Audisift recruiter account." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--paper);
    }
    .auth-wrap { width: 100%; max-width: 440px; }

    .auth-logo {
      display: flex; align-items: center; gap: 10px;
      justify-content: center; margin-bottom: 40px;
    }
    .auth-logo-icon { width: 36px; height: 36px; color: var(--accent); }
    .auth-logo-icon svg { width: 100%; height: 100%; stroke-width: 2px; }
    .auth-logo-text { font-family: var(--font-display); font-size: 1.4rem; color: var(--ink); }

    .auth-card {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 44px 40px;
      box-shadow: var(--shadow-hover);
    }
    .auth-card h1 {
      font-family: var(--font-display); font-size: 2rem;
      color: var(--ink); margin-bottom: 8px; text-align: center;
    }
    .auth-subtitle {
      text-align: center; color: var(--ink-soft); font-size: 0.95rem; margin-bottom: 32px;
    }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 0.82rem; font-weight: 600;
      color: var(--ink-soft); text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 7px;
    }
    .form-input {
      width: 100%; padding: 12px 16px;
      background: var(--paper-warm); border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 1rem;
      font-family: var(--font-body); color: var(--ink);
      transition: var(--transition); box-sizing: border-box;
    }
    .form-input:focus {
      outline: none; border-color: var(--ink); background: var(--paper);
      box-shadow: 0 0 0 3px rgba(26,24,22,0.06);
    }
    .form-input.input-error { border-color: var(--danger); }

    .field-error {
      font-size: 0.82rem; color: var(--danger);
      margin-top: 5px; display: none; font-weight: 500;
    }
    .field-hint {
      font-size: 0.82rem; color: var(--ink-muted); margin-top: 5px;
    }

    .btn-auth {
      width: 100%; padding: 14px;
      background: var(--ink); color: var(--paper);
      border: none; border-radius: var(--radius-sm);
      font-family: var(--font-body); font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: var(--transition); margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-auth:hover:not(:disabled) {
      background: var(--ink-soft); transform: translateY(-1px); box-shadow: var(--shadow-hover);
    }
    .btn-auth:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .auth-error {
      background: var(--danger-light); color: var(--danger);
      border: 1px solid rgba(229,43,80,0.2); border-radius: var(--radius-sm);
      padding: 12px 16px; font-size: 0.9rem; margin-bottom: 20px;
      display: none; font-weight: 500;
    }
    .auth-links {
      text-align: center; margin-top: 28px;
      font-size: 0.9rem; color: var(--ink-soft);
    }
    .auth-links a {
      color: var(--ink); font-weight: 600; text-decoration: none;
      border-bottom: 1px solid var(--border); transition: var(--transition);
    }
    .auth-links a:hover { border-color: var(--ink); }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-wrap">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" class="icon"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5M12 19v3M8 22h8"/></svg>
      </div>
      <div class="auth-logo-text">Audisift</div>
    </div>

    <!-- Card -->
    <div class="auth-card">
      <h1>Create account</h1>
      <p class="auth-subtitle">Start screening job candidates today</p>

      <div id="errorMsg" class="auth-error"></div>

      <form id="registerForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input class="form-input" type="text" id="fullName" name="fullName"
            placeholder="Farhan" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="companyName">Company Name</label>
          <input class="form-input" type="text" id="companyName" name="companyName"
            placeholder="Your Company" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email"
            placeholder="you@company.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password"
            placeholder="At least 8 characters" required autocomplete="new-password" minlength="8" />
          <div id="passwordError" class="field-error"></div>
          <div class="field-hint">8+ characters recommended</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input class="form-input" type="password" id="confirmPassword" name="confirmPassword"
            placeholder="Re-enter your password" required autocomplete="new-password" />
          <div id="confirmError" class="field-error"></div>
        </div>

        <button type="submit" class="btn-auth" id="submitBtn">
          <span id="btnContent">Create Account</span>
        </button>
      </form>
    </div>

    <div class="auth-links">
      Already have an account? <a href="login.html">Sign in</a>
      &nbsp;·&nbsp;
      <a href="interview.html">Take Interview</a>
    </div>

    <div style="text-align:center; margin-top:24px;">
      <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme" style="margin:auto;">
        <svg viewBox="0 0 24 24" fill="none" class="icon theme-toggle-icon"></svg>
      </button>
    </div>
  </div>
</div>

<script>
const passwordInput = document.getElementById('password');
const confirmPasswordInput = document.getElementById('confirmPassword');
const passwordError = document.getElementById('passwordError');
const confirmError = document.getElementById('confirmError');

// Real-time validation
passwordInput.addEventListener('input', () => {
  if (passwordInput.value.length < 8 && passwordInput.value.length > 0) {
    passwordError.textContent = 'Password must be at least 8 characters';
    passwordError.style.display = 'block';
    passwordInput.classList.add('input-error');
  } else {
    passwordError.style.display = 'none';
    passwordInput.classList.remove('input-error');
  }
});

confirmPasswordInput.addEventListener('input', () => {
  if (confirmPasswordInput.value && passwordInput.value !== confirmPasswordInput.value) {
    confirmError.textContent = 'Passwords do not match';
    confirmError.style.display = 'block';
    confirmPasswordInput.classList.add('input-error');
  } else {
    confirmError.style.display = 'none';
    confirmPasswordInput.classList.remove('input-error');
  }
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const fullName = document.getElementById('fullName').value.trim();
  const companyName = document.getElementById('companyName').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = passwordInput.value;
  const confirm  = confirmPasswordInput.value;
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');
  const btnContent = document.getElementById('btnContent');

  errorMsg.style.display = 'none';

  // Client-side validation
  if (password !== confirm) {
    confirmError.textContent = 'Passwords do not match';
    confirmError.style.display = 'block';
    return;
  }
  if (password.length < 8) {
    passwordError.textContent = 'Password must be at least 8 characters';
    passwordError.style.display = 'block';
    return;
  }

  submitBtn.disabled = true;
  btnContent.innerHTML = '<div class="spinner"></div> Creating account…';

  try {
    await register({ fullName, companyName, email, password });
    window.location.href = 'login.html?registered=1';
  } catch (err) {
    errorMsg.textContent = err.message || 'Registration failed. Please try again.';
    errorMsg.style.display = 'block';
    submitBtn.disabled = false;
    btnContent.textContent = 'Create Account';
  }
});
</script>
<script src="js/feedback.js"></script>
</body>
</html>
